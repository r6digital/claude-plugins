name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA. A tag is mutable, so a retagged action
      # would execute in this workflow without any change to the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs scripts from the pull request. Keep the token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Test the manifest validator
        run: node scripts/validate-manifests-test.mjs

      - name: Validate manifest fields and plugin directories
        run: node scripts/validate-manifests.mjs

      - name: Test the removal check
        run: node scripts/check-removals-test.mjs

      - name: Check that removed vendored files stay removed
        run: node scripts/check-removals.mjs

      - name: Test the agent-skills session hook
        # The test calls the hook by a path relative to the plugin directory.
        working-directory: plugins/agent-skills
        run: bash hooks/session-start-test.sh

      - name: Validate every JSON file parses
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r file; do
            if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"; then
              echo "ok   $file"
            else
              echo "FAIL $file"
              rc=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $rc

      - name: Report unreplaced organisation placeholders
        run: |
          set -uo pipefail
          if git grep -In '{{ORG}}' -- . ':!.github/workflows/validate.yml' > /tmp/placeholders.txt; then
            echo "::warning::This repository still carries {{ORG}} placeholders. Replace them with the organisation name before anyone installs from it."
            cat /tmp/placeholders.txt
          else
            echo "No {{ORG}} placeholders remain."
          fi

      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.263

      - name: Run claude plugin validate
        run: |
          set -uo pipefail
          if ! command -v claude >/dev/null 2>&1; then
            echo "SKIPPED: the claude CLI is not on PATH."
            exit 0
          fi
          # Probe by exit code, not by matching help text, so a change to the
          # help layout cannot turn a real failure into a silent skip.
          if ! claude plugin validate --help >/dev/null 2>&1; then
            echo "SKIPPED: this claude CLI ($(claude --version 2>&1)) has no 'plugin validate' subcommand."
            exit 0
          fi
          rc=0
          claude plugin validate . || rc=1
          for dir in plugins/*/; do
            claude plugin validate "$dir" || rc=1
          done
          exit $rc

name: validate

on:
  push:
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate manifest syntax and required fields
        run: node scripts/validate-manifests.mjs

      - name: Validate every JSON file parses
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r file; do
            if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"; then
              echo "ok   $file"
            else
              echo "FAIL $file"
              rc=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $rc

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Run claude plugin validate
        run: |
          set -uo pipefail
          if ! command -v claude >/dev/null 2>&1; then
            echo "SKIPPED: the claude CLI is not on PATH."
            exit 0
          fi
          if ! claude --help 2>&1 | grep -qE '^\s*plugin\b'; then
            echo "SKIPPED: this claude CLI has no 'plugin' subcommand."
            exit 0
          fi
          if ! claude plugin --help 2>&1 | grep -qE '^\s*validate\b'; then
            echo "SKIPPED: this claude CLI has no 'plugin validate' subcommand."
            exit 0
          fi
          rc=0
          claude plugin validate . || rc=1
          for dir in plugins/*/; do
            claude plugin validate "$dir" || rc=1
          done
          exit $rc
